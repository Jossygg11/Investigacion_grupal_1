version: "3.8"

services:
  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: fraudelink-memgraph
    ports:
      - "7687:7687"   # Puerto para conexiones Cypher (Bolt protocol)
      - "7444:7444"   # Puerto para Memgraph Lab / monitoreo
    volumes:
      - memgraph_data:/var/lib/memgraph
      - memgraph_log:/var/log/memgraph
    command: ["--log-level=TRACE"]

  lab:
    image: memgraph/lab:latest
    container_name: fraudelink-lab
    ports:
      - "3000:3000"   # Interfaz web de Memgraph Lab
    depends_on:
      - memgraph
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph
      - QUICK_CONNECT_MG_PORT=7687

volumes:
  memgraph_data:
  memgraph_log:
